services:
  # ── Infrastructure ──────────────────────────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: sagens
      MONGO_INITDB_ROOT_PASSWORD: sagens_dev_pw
      MONGO_INITDB_DATABASE: s_agens
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.11.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Backend (live-reload dev) ───────────────────────────────
  backend:
    image: node:20-slim
    working_dir: /app/backend
    restart: unless-stopped
    ports:
      - "8000:3001"
    volumes:
      - ./:/app
      - backend_node_modules:/app/backend/node_modules
    command: sh -c "cd /app/backend && [ -d node_modules/tsx ] || npm install --no-audit --no-fund; npm run dev"
    environment:
      NODE_ENV: development
      BACKEND_PORT: 3001
      MONGO_URL: mongodb://sagens:sagens_dev_pw@mongo:27017/s_agens?authSource=admin
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JWT_SECRET: dev-only-secret-change-in-production-please
      CORS_ORIGIN: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      INSPECTION_INTERVAL_MS: 5000
    env_file:
      - /run/base44/app.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # ── Frontend (live-reload dev) ──────────────────────────────
  frontend:
    image: node:20-slim
    working_dir: /app/frontend
    restart: unless-stopped
    ports:
      - "3000:5173"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/frontend/node_modules
    command: sh -c "cd /app/frontend && [ -d node_modules/vite ] || npm install --no-audit --no-fund; npm run dev"
    environment:
      VITE_API_URL: https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
  es_data:
  backend_node_modules:
  frontend_node_modules:
