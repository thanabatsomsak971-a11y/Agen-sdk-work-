services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "npm install && npx tsx watch src/server.ts"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      NODE_ENV: development
      BACKEND_PORT: 3001
      MONGO_URL: mongodb://mongo:27017/s_agens
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      INSPECTION_INTERVAL_MS: 5000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      VITE_API_URL: ""
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules:
