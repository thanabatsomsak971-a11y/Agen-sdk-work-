# Base44 dev environment for S-AGENS (Cloudflare edition)
# Frontend (Vite) on port 3000, Worker (wrangler dev) on internal port 8787.
# Vite proxy routes /api + /health to the worker so only port 3000 is public.
services:
  worker:
    image: node:22-slim
    working_dir: /app/worker
    volumes:
      - ./worker:/app/worker
    command: sh -c "npm install && npm run db:migrate:local && npx wrangler dev --port 8787 --ip 0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8787/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

  web:
    image: node:22-slim
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    command: sh -c "npm install && npm run dev"
    environment:
      - VITE_PROXY_TARGET=http://worker:8787
    ports:
      - "3000:5173"
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
