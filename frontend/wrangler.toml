name = "s-agens-web"
compatibility_date = "2024-09-25"
pages_build_output_dir = "dist"

# Pages will build using `npm run build` automatically when deployed via
# `npm run deploy` (which runs `wrangler pages deploy dist`).
# For CI/GitHub-connected deploys, set:
#   Build command:        npm run build
#   Build output dir:     dist
#   Env var VITE_API_URL: https://<your-worker-subdomain>.workers.dev
