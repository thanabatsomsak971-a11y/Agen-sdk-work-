name = "s-agens-api"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# ---- D1 Database (SQLite, free tier: 5GB, 25B reads/mo) ----
# After running `npm run db:create`, paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "s-agens-db"
database_id = "REPLACE_WITH_ID_FROM_db:create"
migrations_dir = "src/db/migrations"

# ---- Durable Object for real-time report stream (via alarms) ----
[[durable_objects.bindings]]
name = "STREAM"
class_name = "ReportStream"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReportStream"]

# ---- Cron trigger: runs inspection every minute ----
[triggers]
crons = ["* * * * *"]

# ---- Secrets: set via `wrangler secret put <NAME>` ----
# ANTHROPIC_API_KEY
# OPENAI_API_KEY
# GOOGLE_API_KEY
# UPSTASH_REDIS_REST_URL       (optional; only if you use Redis)
# UPSTASH_REDIS_REST_TOKEN     (optional)

# ---- Public vars ----
[vars]
CORS_ORIGIN = "http://localhost:5173"
INSPECTION_INTERVAL_MS = "60000"

# ---- Observability ----
[observability]
enabled = true
